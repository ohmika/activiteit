@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241014;--card:#3a1c22;--ink:#ffeceb;--mut:#d4a3aa;--edge:#100507;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241014;--card:#3a1c22;--ink:#ffeceb;--mut:#d4a3aa;--edge:#100507;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:28px 20px 40px}
h1{font-size:2.1rem;line-height:1.05;margin:0 0 8px;font-weight:800}
.sub{margin:0 0 20px;color:var(--mut);line-height:1.4}
.b{display:grid;gap:14px}
.b button{font:inherit;color:#2a1216;border:3px solid var(--edge);border-radius:28px 10px 28px 10px;padding:14px 20px;cursor:pointer;text-align:left;box-shadow:0 5px 0 var(--edge);transition:transform .12s,box-shadow .12s}
.b b{display:block;font-size:1.55rem;font-weight:800}
.b span{font-size:1rem}
.b button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.b button[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:3px}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
#out{margin-top:26px}
.idea{background:var(--card);border:3px solid var(--edge);border-radius:10px 36px 10px 36px;padding:24px 20px 20px;text-align:center;box-shadow:0 5px 0 var(--edge);animation:pop .3s ease-out}
.chip{display:inline-block;padding:2px 14px;border:2px solid var(--edge);border-radius:20px;font-weight:700;color:#2a1216}
.big{font-size:4.2rem;line-height:1;margin-top:10px}
h2{margin:8px 0 16px;font-size:1.7rem;line-height:1.15}
.again{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:3px solid var(--ink);border-radius:30px;padding:8px 22px;cursor:pointer}
.note{margin-top:22px;font-size:.85rem;color:var(--mut);line-height:1.4}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.idea{animation:none}.b button{transition:none}}
</style>
</head>

N("g",PG,TG);N("m",PT,TM);N("l",PT,TL);
const L={g:"Gratis",m:"€10 pp",l:"€20 pp"},C={g:"var(--g)",m:"var(--m)",l:"var(--l)"};
const bag={};let last=null,k=null;
function draw(){
  if(!bag[k]||!bag[k].length){
    const a=D[k].slice();
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
    if(last&&a[a.length-1]===last)[a[0],a[a.length-1]]=[a[a.length-1],a[0]];
    bag[k]=a;
  }
  return last=bag[k].pop();
}
const out=document.getElementById("out"),btns=[...document.querySelectorAll(".b button")];
function show(){
  const t=draw(),i=t.indexOf(" ");
  btns.forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));
  out.innerHTML='<div class="idea"><span class="chip" style="background:'+C[k]+'">'+L[k]+'</span><div class="big"></div><h2></h2><button class="again" type="button">Nog een idee</button></div>';
  out.querySelector(".big").textContent=t.slice(0,i);
  out.querySelector("h2").textContent=t.slice(i+1);
  out.querySelector(".again").onclick=show;
  out.scrollIntoView({behavior:"smooth",block:"nearest"});
}
btns.forEach(b=>b.onclick=()=>{k=b.dataset.k;show()});
